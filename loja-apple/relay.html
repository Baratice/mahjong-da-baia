<!doctype html>
<meta charset="utf-8">
<title>Envio das capturas</title>
<p id="s">Preparando capturas…</p>
<script>
// Página temporária: entrega as capturas da App Store para a aba do App Store Connect que abriu esta página.
const NAMES = ["iphone_pt_1","iphone_pt_2","iphone_pt_3","iphone_en_1","iphone_en_2","iphone_en_3",
  "ipad_pt_1","ipad_pt_2","ipad_pt_3","ipad_en_1","ipad_en_2","ipad_en_3","revisao_loja"];
const TARGET = "https://appstoreconnect.apple.com";
(async () => {
  const dest = window.opener || (window.parent !== window ? window.parent : null);
  if (!dest) { document.getElementById("s").textContent = "Abra pelo App Store Connect."; return; }
  let n = 0;
  for (const name of NAMES) {
    const buf = await (await fetch(name + ".jpg", { cache: "no-store" })).arrayBuffer();
    dest.postMessage({ name, buf }, TARGET, [buf]);
    n++;
  }
  dest.postMessage({ name: "__done", buf: n }, TARGET);
  document.getElementById("s").textContent = "Capturas enviadas: " + n + ". Pode fechar esta aba.";
})();
</script>
