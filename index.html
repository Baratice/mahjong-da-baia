<style>
:root{
--bg1:#e8f6fb; --bg2:#cfeaf4; --ink:#123047; --muted:#4d6b80; --accent:#0e7c86; --accent2:#f2b134;
--tile:#fffaf0; --tileEdge:#d8c7a6; --tileEdge2:#b9a37c; --panel:#ffffff; --danger:#c0392b; --ok:#1e9e5a;
}
body.theme-contraste{ --bg1:#ffffff; --bg2:#f2f2f2; --ink:#000; --muted:#222; --accent:#004a99; --tile:#ffffff; --tileEdge:#555; --tileEdge2:#222; }
body.theme-noite{ --bg1:#16233a; --bg2:#0d1626; --ink:#f3f6fb; --muted:#b8c6da; --accent:#5cc3d6; --panel:#1f2f4a; --tile:#fdf6e6; --tileEdge:#8d7b5a; --tileEdge2:#6c5b3d; }
body.theme-jardim{ --bg1:#eef7e4; --bg2:#d7ecc4; --ink:#21361a; --muted:#4f6b44; --accent:#3f8a2f; --tile:#fffdf3; --tileEdge:#cdbf95; --tileEdge2:#a99a6c; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
background:linear-gradient(180deg,var(--bg1),var(--bg2)); font-size:18px; user-select:none}
button{font:inherit; color:inherit; cursor:pointer; border:none}
input{font:inherit}
.screen{position:absolute; inset:0; display:none; flex-direction:column}
.screen.on{display:flex}
#home{align-items:center; justify-content:center; padding:20px; gap:12px; text-align:center; overflow:auto}
#home h1{margin:0; font-size:34px}
#home .sub{color:var(--muted); margin:-6px 0 2px}
.whale{font-size:58px; line-height:1}
.badge{display:inline-block; background:var(--ok); color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:16px}
.chap{width:100%; max-width:340px; background:var(--panel); border-radius:14px; padding:10px 12px; text-align:left; box-shadow:0 2px 0 rgba(0,0,0,.1)}
.chap b{font-size:18px}
.chap small{display:block; color:var(--muted); font-size:15px; margin-top:2px}
.bar{height:10px; background:rgba(0,0,0,.08); border-radius:99px; margin-top:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok); border-radius:99px}
.proto{font-size:14px; color:var(--muted); max-width:340px}
.big{width:100%; max-width:340px; min-height:60px; border-radius:16px; background:var(--accent); color:#fff; font-size:22px; font-weight:700; box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sec{width:100%; max-width:340px; min-height:54px; border-radius:14px; background:var(--panel); font-size:19px; font-weight:600; box-shadow:0 2px 0 rgba(0,0,0,.12); border:2px solid rgba(0,0,0,.06)}
.row{display:flex; gap:10px; width:100%; max-width:340px}
.row .sec{flex:1}
.premiumTag{color:var(--accent2); font-weight:800}
#top{height:58px; display:flex; align-items:center; gap:8px; padding:0 10px; flex:none}
#top .icon{width:48px; height:48px; border-radius:12px; background:var(--panel); font-size:22px; box-shadow:0 2px 0 rgba(0,0,0,.12)}
#top .title{flex:1; text-align:center; font-weight:800; font-size:18px; line-height:1.15}
#top .title small{display:block; font-weight:600; color:var(--muted); font-size:14px}
#boardWrap{flex:1; position:relative; overflow:hidden}
#board{position:absolute; left:0; top:0}
.tile{position:absolute; border-radius:10px; background:var(--tile);
box-shadow: var(--d) var(--d) 0 var(--tileEdge), calc(var(--d)*1.6) calc(var(--d)*1.6) 0 var(--tileEdge2), 0 0 0 1px rgba(0,0,0,.25);
display:flex; align-items:center; justify-content:center; transition:opacity .25s, transform .25s, filter .2s}
.tile .face{position:absolute; inset:9%; border-radius:7px; display:flex; align-items:center; justify-content:center}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height:1}
body.hl .tile.blocked{filter:brightness(.72) saturate(.5)}
.tile.sel{outline:4px solid var(--accent2); outline-offset:-2px; transform:translate(-2px,-3px)}
.tile.hint{animation:pulse .8s infinite alternate}
@keyframes pulse{from{outline:4px solid var(--ok)} to{outline:6px solid #7ff0b0}}
.tile.gone{opacity:0; transform:scale(.6); pointer-events:none}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#bottom{flex:none; display:flex; gap:8px; padding:8px 10px 14px; justify-content:center}
#bottom button{flex:1; max-width:130px; min-height:64px; border-radius:14px; background:var(--panel); font-weight:700; font-size:16px; box-shadow:0 3px 0 rgba(0,0,0,.14); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
#bottom button .ic{font-size:24px}
#bottom button .cnt{font-size:13px; color:var(--muted); font-weight:600}
#bottom button:disabled{opacity:.45}
#modal{position:absolute; inset:0; background:rgba(5,20,35,.55); display:none; align-items:center; justify-content:center; padding:14px; z-index:99999}
#modal.on{display:flex}
.card{background:var(--panel); border-radius:20px; padding:20px 18px; width:100%; max-width:400px; max-height:94vh; overflow:auto; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{margin:4px 0 10px; font-size:25px}
.card h3{margin:18px 0 4px; font-size:19px; text-align:left}
.card p{margin:8px 0; color:var(--muted); line-height:1.4}
.card .big,.card .sec{margin-top:10px}
.stars{font-size:44px; letter-spacing:4px}
.plan{border:2px solid rgba(0,0,0,.1); border-radius:14px; padding:12px; margin:8px 0; text-align:left; display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.plan.best{border-color:var(--accent2); background:rgba(242,177,52,.08)}
.plan .pn{flex:1 1 100%}
.plan .price{flex:1; font-weight:800; font-size:18px}
.plan .price small{display:block; font-weight:600}
.plan b{display:block; font-size:18px}
.plan small{color:var(--muted)}
.plan button{min-height:48px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; padding:0 14px}
.plan button.owned{background:#9fb3bf}
.tag{display:inline-block; background:var(--accent2); color:#3b2a00; font-size:13px; font-weight:800; border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:middle}
.noads{background:var(--ok); color:#fff; border-radius:12px; padding:10px; font-weight:700; margin:6px 0 10px}
.legal{font-size:13px; color:var(--muted); text-align:left; line-height:1.45; margin-top:12px}
.links{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px}
.links button{background:none; text-decoration:underline; color:var(--accent); font-size:15px; min-height:40px; padding:0 6px}
ul.ben{text-align:left; padding-left:20px; margin:8px 0; color:var(--ink); line-height:1.5}
.setRow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid rgba(0,0,0,.08); text-align:left}
.toggle{min-width:76px; min-height:44px; border-radius:999px; background:#c9d3db; font-weight:700}
.toggle.on{background:var(--ok); color:#fff}
.themes{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px}
.themes button{min-height:52px; border-radius:12px; background:var(--panel); border:2px solid rgba(0,0,0,.12); font-weight:700; font-size:16px}
.themes button.cur{border-color:var(--accent)}
.album{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.pc{border-radius:12px; padding:10px 4px; background:rgba(0,0,0,.05); font-size:13px; font-weight:700; min-height:92px}
.pc .em{font-size:34px; display:block; margin-bottom:4px}
.pc.lock{opacity:.45}
.jump{display:flex; gap:8px; margin-top:8px}
.jump input{flex:1; min-height:48px; border-radius:12px; border:2px solid rgba(0,0,0,.15); padding:0 10px; background:var(--panel); color:var(--ink)}
.jump button{min-height:48px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; padding:0 16px}
#toast{position:absolute; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(10,30,45,.92); color:#fff; padding:12px 18px; border-radius:12px; font-size:17px; z-index:100000; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; text-align:center}
#toast.on{opacity:1}
</style>
</head>

if(type==="twin"){ const w=Math.floor((c-1)/2); for(let j=0;j<r;j++){ for(let i=0;i<w;i++)add(i,j); for(let i=c-w;i<c;i++)add(i,j);} }
else if(type==="cross"){ const h0=Math.floor(r/2)-1, v0=Math.floor(c/2)-1;
for(let j=0;j<r;j++)for(let i=0;i<c;i++){ if((j>=h0&&j<=h0+1)||(i>=v0&&i<=v0+1)) add(i,j);} }
else if(type==="diamond"){ const mid=(r-1)/2; for(let j=0;j<r;j++){ const cut=Math.round(Math.abs(j-mid)); for(let i=cut;i<c-cut;i++)add(i,j);} }
else { for(let j=0;j<r;j++)for(let i=0;i<c;i++)add(i,j); }
return cells;
}
const SHAPES={
whale:["..XXXXXX....",".XXXXXXXXX.X","XXXXXXXXXXXX","XXXXXXXXXXX.",".XXXXXXXX..."],
heart:[".XXX.XXX.","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX..."],
anchor:["...XXX...","...XXX...","XXXXXXXXX","XXXXXXXXX","...XXX...","X..XXX..X","XXXXXXXXX",".XXXXXXX."],
fish:["...XXXX.....","..XXXXXX..XX",".XXXXXXXXXXX","XXXXXXXXXXX.",".XXXXXXX..XX","..XXXXX....."],
star:["....X....","...XXX...","XXXXXXXXX",".XXXXXXX.","..XXXXX..",".XXX.XXX.","XX.....XX"]
};
const SHAPE_KEYS=Object.keys(SHAPES);
function maskFromArt(art){const c=[];art.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==="X")c.push([i,j]);}));return c;}
function stack(base,L,R,halfBias){
const layers=[base.map(([i,j])=>[2*i,2*j])];
for(let z=1;z<L;z++){
const cur=new Set(layers[z-1].map(([x,y])=>x+","+y)); const has=(x,y)=>cur.has(x+","+y);
const half=R()<halfBias; const nx=[];
for(const [x,y] of layers[z-1]){
if(half){ if(has(x+2,y)&&has(x,y+2)&&has(x+2,y+2)) nx.push([x+1,y+1]); }
else { if(has(x-2,y)&&has(x+2,y)&&has(x,y-2)&&has(x,y+2)) nx.push([x,y]); }
}
if(!nx.length) break; layers.push(nx);
}
const out=[]; layers.forEach((lay,z)=>lay.forEach(([x,y])=>out.push({x,y,z})));
if(out.length%2){ let k=out.length-1; out.splice(k,1); }
return out;
}
function levelParams(n){
const p=((n-1)%PER_CHAPTER)+1;
let target,L,fmin,fmax;
if(n<=3){ target=[24,28,32][n-1]; L=n===1?1:2; fmin=8; fmax=10; }
else if(n<=20){ target=32+(n-4)*1.5; L=n<12?2:3; fmin=10; fmax=16; }
else if(n<=100){ target=56+(n-20)*0.45; L=3+((n%3)===0?1:0); fmin=16; fmax=24; }
else { target=72+((n*37)%73); L=4+((n%2)); fmin=24; fmax=32; }
const kind = n<=3?"normal" : (p%10===0?"special" : (p%5===0?"calm":"normal"));
if(kind==="calm"){ target=Math.max(24,target*0.6); L=Math.max(1,L-1); }
return {n,target:Math.round(target),L,fmin,fmax,kind};
}
function buildPositions(prm,seed){
const R=rng(seed);
if(prm.kind==="special"){
const k10=Math.floor(prm.n/10), key=SHAPE_KEYS[(k10+Math.floor(k10/5))%SHAPE_KEYS.length];
const L=prm.n<=20?2:Math.min(prm.L+1,4);
return {pos:stack(maskFromArt(SHAPES[key]),L,rng(seed),0.6),shape:key};
}
const types=prm.n<=20?["rect","rect","diamond"]:["rect","twin","cross","diamond","rect"];
const type=types[Math.floor(R()*types.length)];
let best=null;
for(let c=3;c<=12;c++)for(let r=2;r<=8;r++){
if((type==="twin"&&c<5)||(type==="cross"&&(c<5||r<4))||(type==="diamond"&&r<3)) continue;
const pos=stack(baseMask(type,c,r),prm.L,rng(seed),0.5);
const score=Math.abs(pos.length-prm.target)+Math.abs(c/r-1.6)*3;
if(pos.length>=16 && (!best||score<best.score)) best={score,pos};
}
return {pos:best.pos,shape:type};
}
let G=null;
function buildNb(){
const ts=G.tiles; ts.forEach(a=>{a.up=[];a.lf=[];a.rt=[];});
for(let i=0;i<ts.length;i++)for(let k=0;k<ts.length;k++){ if(i===k)continue; const a=ts[i],b=ts[k];
if(b.z===a.z+1&&Math.abs(b.x-a.x)<2&&Math.abs(b.y-a.y)<2) a.up.push(k);
else if(b.z===a.z&&Math.abs(b.y-a.y)<2){ if(b.x===a.x-2)a.lf.push(k); else if(b.x===a.x+2)a.rt.push(k); } }
}
function isFree(i,alive){ const a=G.tiles[i];
if(a.up.some(k=>alive[k])) return false;
return !(a.lf.some(k=>alive[k]) && a.rt.some(k=>alive[k]));
}
function pairUp(indices,R){
for(let attempt=0;attempt<300;attempt++){
const alive=G.tiles.map(()=>false); indices.forEach(i=>alive[i]=true);
let remaining=indices.length; const pairs=[]; let ok=true;
while(remaining>0){
const free=[]; for(const i of indices) if(alive[i]&&isFree(i,alive)) free.push(i);
if(free.length<2){ok=false;break;}
free.sort((p,q)=>G.tiles[q].z-G.tiles[p].z+(R()-.5)*1.5);
const a=free[0], rest=free.slice(1), b=rest[Math.floor(R()*Math.min(rest.length,4))];
alive[a]=false; alive[b]=false; remaining-=2; pairs.push([a,b]);
}
if(ok) return pairs;
}
return null;
}
function newBoard(pos,seed,fmin,fmax){
const tr=wrap.clientHeight>wrap.clientWidth*1.15;
G={tiles:pos.map(p=>tr?{x:p.y,y:p.x,z:p.z,f:0,alive:true}:{x:p.x,y:p.y,z:p.z,f:0,alive:true}),sel:-1,undo:[],used:0};
buildNb();
const R=rng(seed);
const pairs=pairUp(G.tiles.map((_,i)=>i),R);
if(!pairs) return newBoard(pos,seed+1,fmin,fmax);
const nf=Math.max(2,Math.min(FACES.length,Math.min(pairs.length,fmin+Math.floor(R()*(fmax-fmin+1)))));
const order=[...Array(FACES.length).keys()].sort(()=>R()-.5).slice(0,nf);
pairs.forEach((pr,k)=>{const f=order[k%nf]; G.tiles[pr[0]].f=f; G.tiles[pr[1]].f=f;});
}
const aliveArr=()=>G.tiles.map(x=>x.alive);
function freePairs(){ const al=aliveArr(), byF={};
G.tiles.forEach((x,i)=>{ if(x.alive&&isFree(i,al)) (byF[x.f]=byF[x.f]||[]).push(i); });
const out=[]; for(const f in byF){ if(byF[f].length>=2) out.push([byF[f][0],byF[f][1]]); } return out; }
function reshuffle(seed){
const R=rng(seed);
const idx=G.tiles.map((x,i)=>x.alive?i:-1).filter(i=>i>=0);
let pairs=pairUp(idx,R);
if(!pairs){ // não dá para resolver onde estão (ex.: duas peças empilhadas): espalha as restantes num tabuleiro plano
const n=idx.length, cols=Math.min(n,Math.max(2,Math.ceil(Math.sqrt(n*1.6))));
const minX=Math.min(...idx.map(i=>G.tiles[i].x)), minY=Math.min(...idx.map(i=>G.tiles[i].y));
idx.forEach((i,k)=>{G.tiles[i].x=minX+(k%cols)*2; G.tiles[i].y=minY+Math.floor(k/cols)*2; G.tiles[i].z=0;});
G.tiles.forEach(x=>{ if(!x.alive){ x.x=-99; x.y=-99; x.z=0; } });
buildNb(); pairs=pairUp(idx,R); if(!pairs) return false;
}
const fs={}; idx.forEach(i=>{fs[G.tiles[i].f]=(fs[G.tiles[i].f]||0)+1;});
const fp=[]; for(const f in fs){ for(let n=0;n<fs[f]/2;n++) fp.push(+f); }
fp.sort(()=>R()-.5);
pairs.forEach((pr,k)=>{G.tiles[pr[0]].f=fp[k]; G.tiles[pr[1]].f=fp[k];});
G.undo=[]; return true;
}

const board=$("board"), wrap=$("boardWrap");
let geo=null;
function layoutGeo(){
let mx=0,my=0,mz=0; G.tiles.forEach(p=>{ if(p.x<0)return; mx=Math.max(mx,p.x+2);my=Math.max(my,p.y+2);mz=Math.max(mz,p.z);});
const W0=wrap.clientWidth-16, H0=wrap.clientHeight-16, ratio=1.28, dk=0.1;
let w=Math.min(W0/(mx/2+mz*dk+0.2), H0/((my/2)*ratio+mz*dk+0.2)); w=Math.min(w,110);
const h=w*ratio, d=Math.max(3,w*dk);
const bw=mx/2*w+mz*d+d*1.6, bh=my/2*h+mz*d+d*1.6;
geo={w,h,d,mz,off:[(wrap.clientWidth-bw)/2,(wrap.clientHeight-bh)/2]};
}
function render(){

const {w,h,d,mz,off}=geo;
G.tiles.forEach((p,i)=>{
const el=document.createElement("div"); el.className="tile"; el.dataset.i=i;
el.style.width=(w-2)+"px"; el.style.height=(h-2)+"px";
el.style.left=(off[0]+p.x/2*w+(mz-p.z)*d)+"px"; el.style.top=(off[1]+p.y/2*h+(mz-p.z)*d)+"px";
el.style.zIndex=p.z*10000+Math.max(0,p.y)*100+Math.max(0,p.x); el.style.setProperty("--d",Math.max(2,d*0.6)+"px");
el.innerHTML='<div class="face" style="background:'+faceColor(p.f)+'"><span class="em" style="font-size:'+(w*0.6)+'px">'+FACES[p.f]+'</span></div>';
el.addEventListener("click",()=>onTile(i));
p.el=el; board.appendChild(el);
});
refresh();
}

function onTile(i){

document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{const id=b.dataset.th;
if(!themeOwned(id)){toast(t("locked"));openStore();return;} S.theme=id;save();applyPrefs();openSettings();});
bind("lRestore2",()=>toast(t("restored"))); bind("lManage2",()=>toast(t("manageSim"))); bind("lTerms2",()=>toast(t("linkSim"))); bind("lPriv2",()=>toast(t("linkSim"))); bind("lSup2",()=>toast(t("linkSim")));
bind("jGo",()=>{ const v=Math.max(1,Math.min(MAX_LEVEL,parseInt($("jIn").value,10)||1)); S.level=Math.max(S.level,v); save(); closeModal(); startLevel(v); });
bind("sReset",()=>{modal('<h2>'+t("confirmReset")+'</h2><button class="big" id="cY" style="background:var(--danger)">'+t("yes")+'</button><button class="sec" id="cN">'+t("no")+'</button>');
bind("cY",()=>{const lang=S.lang;S=defState();S.lang=lang;save();applyPrefs();closeModal();toast(t("resetDone"));}); bind("cN",openSettings);});
bind("sCancel",()=>{S.premium=false;S.plan="";if(!themeOwned(S.theme))S.theme="baia";save();applyPrefs();openSettings();});
bind("mClose",closeModal);
}
function applyPrefs(){
if(!themeOwned(S.theme)) S.theme="baia";
document.body.className=(S.hl?"hl ":"")+"theme-"+S.theme;
document.documentElement.lang=S.lang==="pt"?"pt-BR":"en";
$("tTitle").textContent=t("title"); document.title=t("title")+(S.lang==="pt"?" (protótipo)":" (prototype)");
$("tSub").textContent=t("sub"); $("tNoAds").textContent=t("noads");
const lv=Math.min(S.level,MAX_LEVEL), c=Math.ceil(lv/PER_CHAPTER), p=((lv-1)%PER_CHAPTER)+1;
const fin=S.level>MAX_LEVEL;
$("chap").innerHTML='<b><span class="em">'+CH_EMOJI[c-1]+'</span> '+t("chapter")+' '+c+' · '+t("ch")[c-1]+'</b><small>'+(fin?t("allDone"):t("level")+' '+p+'/'+PER_CHAPTER+' · '+S.album.length+'/30 📮')+'</small><div class="bar"><i style="width:'+(fin?100:((p-1)/PER_CHAPTER*100))+'%"></i></div>';
$("bPlay").textContent=fin?(t("play")+" · "+MAX_LEVEL+"/"+MAX_LEVEL+" ✓"):(t("play")+" · "+t("level")+" "+lv);
$("bDaily").textContent=S.dailyDone===today()?t("dailyDone"):t("daily");
$("bAlbum").textContent=t("album");
$("bStore").innerHTML=S.premium?'<span class="premiumTag">'+t("active")+'</span>':t("store");
$("bSettings").textContent=t("settings"); $("tProto").textContent=t("proto");
$("bLang").textContent=S.lang==="pt"?"🇧🇷 PT · trocar":"🇺🇸 EN · switch";
if(G && $("game").classList.contains("on")) refresh();
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));}
function goHome(){ if(G) G.sel=-1; show("home"); applyPrefs(); }
function startLevel(n){
rollDay(); n=Math.max(1,Math.min(MAX_LEVEL,n));
FACES=SET_BAIA; show("game");
const prm=levelParams(n), seed=1000+n*7919, b=buildPositions(prm,seed);
newBoard(b.pos,seed,prm.fmin,prm.fmax); G.level=n; G.mode="level"; G.kind=prm.kind; G.shape=b.shape; render();
}
function startDaily(){
rollDay();
if(S.dailyDone===today()&&!S.premium){ modal('<h2>'+t("dailyT")+'</h2><p>'+t("dailyAlready")+'</p><button class="big" id="mClose">'+t("close")+'</button>'); bind("mClose",closeModal); return; }
FACES=SET_BAIA; show("game");
const seed=hashStr(today()), prm={n:60+seed%40,target:76,L:3,fmin:18,fmax:24,kind:(seed%2?"special":"normal")};
const b=buildPositions(prm,seed); newBoard(b.pos,seed,prm.fmin,prm.fmax); G.level=0; G.mode="daily"; render();
}
function startPack(id,k){
rollDay(); FACES=id==="carnaval"?SET_CARNAVAL:SET_MAR; show("game");
const seed=hashStr(id)+k*104729, prm=levelParams(20+k*3); if(k%10===0)prm.kind="special";
const b=buildPositions(prm,seed); newBoard(b.pos,seed,Math.min(prm.fmin,FACES.length-4),Math.min(prm.fmax,FACES.length));
G.level=k; G.mode="pack"; G.pack=id; render();
}
$("bPlay").onclick=()=>{ if(S.level>MAX_LEVEL){ modal('<h2>'+t("allDone")+'</h2><p>'+t("allDoneP")+'</p><button class="big" id="mClose">'+t("close")+'</button>'); bind("mClose",closeModal); return; } startLevel(S.level); };
$("bDaily").onclick=startDaily; $("bAlbum").onclick=openAlbum;
$("bStore").onclick=openStore; $("bGStore").onclick=openStore; $("bSettings").onclick=openSettings;
$("bLang").onclick=()=>{S.lang=S.lang==="pt"?"en":"pt";save();applyPrefs();};
$("bBack").onclick=goHome; $("bHint").onclick=useHint; $("bUndo").onclick=useUndo; $("bShuffle").onclick=()=>useShuffle(false);
window.addEventListener("resize",()=>{ if(G && $("game").classList.contains("on")) render(); });
applyPrefs();
window.__mj={get G(){return G;},get S(){return S;},freePairs,startLevel,startDaily,startPack,onTile,useUndo,useShuffle,useHint,levelParams,buildPositions,
isFreeNow:i=>isFree(i,aliveArr()),setInstall:d=>{S.install=d;save();}};
})();
</script>
</body>
