<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{
--bg1:#e8f6fb; --bg2:#cfeaf4; --ink:#123047; --muted:#4d6b80; --accent:#0e7c86; --accent2:#f2b134;
--tile:#fffaf0; --tileEdge:#d8c7a6; --tileEdge2:#b9a37c; --panel:#ffffff; --danger:#c0392b; --ok:#1e9e5a;
}
body.theme-contraste{ --bg1:#ffffff; --bg2:#f2f2f2; --ink:#000; --muted:#222; --accent:#004a99; --tile:#ffffff; --tileEdge:#555; --tileEdge2:#222; }
body.theme-noite{ --bg1:#16233a; --bg2:#0d1626; --ink:#f3f6fb; --muted:#b8c6da; --accent:#5cc3d6; --panel:#1f2f4a; --tile:#fdf6e6; --tileEdge:#8d7b5a; --tileEdge2:#6c5b3d; }
body.theme-jardim{ --bg1:#eef7e4; --bg2:#d7ecc4; --ink:#21361a; --muted:#4f6b44; --accent:#3f8a2f; --tile:#fffdf3; --tileEdge:#cdbf95; --tileEdge2:#a99a6c; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
background:linear-gradient(180deg,var(--bg1),var(--bg2)); font-size:18px; user-select:none}
button{font:inherit; color:inherit; cursor:pointer; border:none}
input{font:inherit}
.screen{position:absolute; inset:0; display:none; flex-direction:column}
.screen.on{display:flex}
.sndBtn{position:absolute; top:12px; right:12px; width:48px; height:48px; border-radius:12px; background:var(--panel); font-size:22px; box-shadow:0 2px 0 rgba(0,0,0,.12); z-index:5}
#home{align-items:center; justify-content:center; padding:20px; gap:12px; text-align:center; overflow:auto}
#home h1{margin:0; font-size:34px}
#home .sub{color:var(--muted); margin:-6px 0 2px}
.whale{font-size:58px; line-height:1}
.badge{display:inline-block; background:var(--ok); color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:16px}
.chap{width:100%; max-width:340px; background:var(--panel); border-radius:14px; padding:10px 12px; text-align:left; box-shadow:0 2px 0 rgba(0,0,0,.1)}
.chap b{font-size:18px}
.chap small{display:block; color:var(--muted); font-size:15px; margin-top:2px}
.bar{height:10px; background:rgba(0,0,0,.08); border-radius:99px; margin-top:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok); border-radius:99px}
.proto{font-size:14px; color:var(--muted); max-width:340px}
.big{width:100%; max-width:340px; min-height:60px; border-radius:16px; background:var(--accent); color:#fff; font-size:22px; font-weight:700; box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sec{width:100%; max-width:340px; min-height:54px; border-radius:14px; background:var(--panel); font-size:19px; font-weight:600; box-shadow:0 2px 0 rgba(0,0,0,.12); border:2px solid rgba(0,0,0,.06)}
.row{display:flex; gap:10px; width:100%; max-width:340px}
.row .sec{flex:1; font-size:16px; padding:0 6px; line-height:1.2}
.premiumTag{color:var(--accent2); font-weight:800}
#top{height:58px; display:flex; align-items:center; gap:8px; padding:0 10px; flex:none}
#top .icon{width:48px; height:48px; border-radius:12px; background:var(--panel); font-size:22px; box-shadow:0 2px 0 rgba(0,0,0,.12)}
#top .title{flex:1; text-align:center; font-weight:800; font-size:18px; line-height:1.15}
#top .title small{display:block; font-weight:600; color:var(--muted); font-size:14px}
@media (max-width:400px){ #top{gap:6px; padding:0 8px} #top .title{font-size:15px} #top .title small{font-size:13px} }
#boardWrap{flex:1; position:relative; overflow:hidden}
#board{position:absolute; left:0; top:0}
.tile{position:absolute; border-radius:10px; background:var(--tile);
box-shadow: var(--d) var(--d) 0 var(--tileEdge), calc(var(--d)*1.6) calc(var(--d)*1.6) 0 var(--tileEdge2), 0 0 0 1px rgba(0,0,0,.25);
display:flex; align-items:center; justify-content:center; transition:opacity .25s, transform .25s, filter .2s}
.tile .face{position:absolute; inset:9%; border-radius:7px; display:flex; align-items:center; justify-content:center}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height:1}
body.hl .tile.blocked{filter:brightness(.72) saturate(.5)}
.tile.sel{outline:4px solid var(--accent2); outline-offset:-2px; transform:translate(-2px,-3px)}
.tile.hint{animation:pulse .8s infinite alternate}
@keyframes pulse{from{outline:4px solid var(--ok)} to{outline:6px solid #7ff0b0}}
.tile.gone{opacity:0; transform:scale(.6); pointer-events:none}
.tile.shake{animation:shake .3s}
.tile.nudge{animation:nudge .55s ease-in-out 2; outline:4px solid var(--ok); outline-offset:-2px; z-index:999}
@keyframes nudge{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) translateY(-3px)}40%{transform:rotate(6deg) translateY(-3px)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){ .tile.nudge{animation:none} }
#ahBar{position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:#123047; color:#fff; border-radius:14px; padding:10px 12px; display:none; gap:10px; align-items:center; font-size:15px; font-weight:700; width:max-content; max-width:92%; z-index:99000; box-shadow:0 6px 18px rgba(0,0,0,.25)}
#ahBar.on{display:flex} #ahBar button{background:#ffd166; color:#123047; border-radius:10px; min-height:40px; padding:0 12px; font-weight:800; flex:none}

.av.em{background:#e6f4f8}
.avgrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:6px 0} .avgrid button{min-height:56px; border-radius:14px; background:rgba(0,0,0,.05); display:flex; align-items:center; justify-content:center; border:3px solid transparent} .avgrid button.cur{border-color:var(--accent)}
#avCv{width:240px; height:240px; border-radius:50%; touch-action:none; cursor:grab; display:block; margin:8px auto; box-shadow:0 0 0 4px var(--accent)}

#bottom{flex:none; display:flex; gap:8px; padding:8px 10px 14px; justify-content:center}

#bottom button .ic{font-size:24px}
#bottom button .cnt{font-size:13px; color:var(--muted); font-weight:600}
#bottom button:disabled{opacity:.45}
#modal{position:absolute; inset:0; background:rgba(5,20,35,.55); display:none; align-items:center; justify-content:center; padding:14px; z-index:99999}
#modal.on{display:flex}
.card{background:var(--panel); border-radius:20px; padding:20px 18px; width:100%; max-width:400px; max-height:94vh; overflow:auto; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{margin:4px 0 10px; font-size:25px}

.plan .pn{flex:1 1 100%}
.plan .price{flex:1; font-weight:800; font-size:18px}

.plan b{display:block; font-size:18px}
.plan small{color:var(--muted)}
.plan button{min-height:48px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; padding:0 14px}
.plan button.owned{background:#9fb3bf}
.tag{display:inline-block; background:var(--accent2); color:#3b2a00; font-size:13px; font-weight:800; border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:middle}
.noads{background:var(--ok); color:#fff; border-radius:12px; padding:10px; font-weight:700; margin:6px 0 10px}
.legal{font-size:13px; color:var(--muted); text-align:left; line-height:1.45; margin-top:12px}
.links{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px}

ul.ben{text-align:left; padding-left:20px; margin:8px 0; color:var(--ink); line-height:1.5}
.setRow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid rgba(0,0,0,.08); text-align:left}
.toggle{min-width:76px; min-height:44px; border-radius:999px; background:#c9d3db; font-weight:700}
.toggle.on{background:var(--ok); color:#fff}
.free4all{background:rgba(30,158,90,.1); border:2px solid rgba(30,158,90,.35); border-radius:12px; padding:10px; text-align:left; font-size:15px; color:var(--ink); margin:6px 0}
.days{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px}

.streak{font-weight:800; color:#d35400}
.face img{width:100%; height:100%; object-fit:cover; border-radius:6px; display:block; pointer-events:none}

.excl{border:2px solid #8e44ad; background:rgba(142,68,173,.07)}
.privacy{font-size:13px; color:var(--muted); text-align:left; margin:2px 0 8px}
.av{display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; background:#6aa9bd; color:#fff; font-weight:800; font-size:17px; border:3px solid transparent; flex:none}

.tabs{display:flex; gap:6px; margin:6px 0} .tabs button{flex:1; min-height:46px; border-radius:10px; background:rgba(0,0,0,.06); font-weight:700} .tabs button.cur{background:var(--accent); color:#fff}
#prof{display:flex; align-items:center; gap:10px; width:100%; max-width:340px; background:var(--panel); border-radius:14px; padding:8px 12px; text-align:left; box-shadow:0 2px 0 rgba(0,0,0,.1)}
#prof .pn{flex:1; min-width:0} #prof b{display:block; font-size:17px} #prof small{color:var(--muted); font-size:13px}
.shimg{width:100%; border-radius:12px; margin-top:8px; box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ckrow{display:flex; align-items:center; gap:10px; text-align:left; margin:10px 0; font-size:16px} .ckrow input{width:24px; height:24px}
.nickin{width:100%; min-height:50px; border-radius:12px; border:2px solid rgba(0,0,0,.15); padding:0 12px; font-size:18px; background:var(--panel); color:var(--ink)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0}
.gc{border:2px solid rgba(0,0,0,.1); border-radius:14px; padding:10px 8px; text-align:center; display:flex; flex-direction:column; background:var(--panel)}
.gc.new{border-color:var(--accent2); background:rgba(242,177,52,.08)}
.gc .em{font-size:22px; letter-spacing:2px; line-height:1.3}
.gc b{display:block; font-size:15px; margin:4px 0 2px; line-height:1.2}
.gc small{display:block; color:var(--muted); font-size:12px; flex:1}
.gc .pr{font-weight:800; margin-top:4px}
.gc button{min-height:44px; width:100%; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; margin-top:6px}
.gc button.owned{background:#9fb3bf}
.gc .tag{margin:0 0 4px; align-self:center}
#home > :first-child{margin-top:auto} #home > :last-child{margin-bottom:auto}
.fx{position:absolute; pointer-events:none; z-index:99990; font-size:22px; animation:fx .7s ease-out forwards}
@keyframes fx{to{transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0}}
.combo{position:absolute; left:50%; top:40%; font-size:36px; font-weight:900; color:#f2b134; text-shadow:0 2px 0 #7a4b00,0 0 14px rgba(0,0,0,.25); pointer-events:none; z-index:99991; animation:cmb .9s ease-out forwards; white-space:nowrap}
@keyframes cmb{0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.15)} 100%{opacity:0; transform:translate(-50%,-110%) scale(1)}}
#memo{position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:99992; pointer-events:none; background:rgba(5,20,35,.3)}
#memo.on{display:flex; animation:memo 1.5s ease forwards}
#memo .mc{background:#fff; padding:10px 10px 14px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); transform:rotate(-2deg); text-align:center}
#memo img{width:230px; height:230px; object-fit:cover; border-radius:8px; display:block}
#memo p{margin:8px 0 0; font-weight:800; color:#123047; font-size:19px; max-width:230px}

.gifts{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:8px 0}
.gift{border-radius:10px; padding:6px 1px; background:rgba(0,0,0,.05); font-size:11px; font-weight:700; color:var(--muted)}
.gift .em{font-size:22px; display:block}
.gift.done{opacity:.4} .gift.today{background:rgba(242,177,52,.3); outline:3px solid var(--accent2); color:var(--ink)}
.msrow{display:flex; gap:8px; justify-content:center; margin:8px 0}
.msrow div{display:flex; flex-direction:column; align-items:center; font-size:12px; font-weight:700; color:var(--muted)}
.msrow .lk{opacity:.35; filter:grayscale(1)}
#evt{cursor:pointer}
.capl{display:flex; align-items:center; gap:8px; margin:6px 0} .capl img{width:48px; height:48px; object-fit:cover; border-radius:8px} .capl input{flex:1; min-height:44px; border-radius:10px; border:2px solid rgba(0,0,0,.15); padding:0 10px; font-size:16px; background:var(--panel); color:var(--ink)}
.vs{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin:10px 0}
.vs div{background:rgba(0,0,0,.05); border-radius:12px; padding:10px 4px} .vs b{display:block; font-size:22px} .vs .w{background:rgba(30,158,90,.18); outline:2px solid var(--ok)}

.av.fr-d30{border-color:#cd7f32; box-shadow:0 0 0 2px #f3d9c0}

function baseMask(type,c,r){
const cells=[];
const add=(i,j)=>cells.push([i,j]);
if(type==="twin"){ const w=Math.floor((c-1)/2); for(let j=0;j<r;j++){ for(let i=0;i<w;i++)add(i,j); for(let i=c-w;i<c;i++)add(i,j);} }
else if(type==="cross"){ const h0=Math.floor(r/2)-1, v0=Math.floor(c/2)-1;
for(let j=0;j<r;j++)for(let i=0;i<c;i++){ if((j>=h0&&j<=h0+1)||(i>=v0&&i<=v0+1)) add(i,j);} }
else if(type==="diamond"){ const mid=(r-1)/2; for(let j=0;j<r;j++){ const cut=Math.round(Math.abs(j-mid)); for(let i=cut;i<c-cut;i++)add(i,j);} }
else { for(let j=0;j<r;j++)for(let i=0;i<c;i++)add(i,j); }
return cells;
}

function stack(base,L,R,halfBias){
const layers=[base.map(([i,j])=>[2*i,2*j])];
for(let z=1;z<L;z++){
const cur=new Set(layers[z-1].map(([x,y])=>x+","+y)); const has=(x,y)=>cur.has(x+","+y);
const half=R()<halfBias; const nx=[];
for(const [x,y] of layers[z-1]){
if(half){ if(has(x+2,y)&&has(x,y+2)&&has(x+2,y+2)) nx.push([x+1,y+1]); }
else { if(has(x-2,y)&&has(x+2,y)&&has(x,y-2)&&has(x,y+2)) nx.push([x,y]); }
}
if(!nx.length) break; layers.push(nx);
}
const out=[]; layers.forEach((lay,z)=>lay.forEach(([x,y])=>out.push({x,y,z})));
if(out.length%2){ let k=out.length-1; out.splice(k,1); }
return out;
}
function levelParams(n){
const p=((n-1)%PER_CHAPTER)+1;
let target,L,fmin,fmax;
if(n<=3){ target=[24,28,32][n-1]; L=n===1?1:2; fmin=8; fmax=10; }
else if(n<=20){ target=32+(n-4)*1.5; L=n<12?2:3; fmin=10; fmax=16; }
else if(n<=100){ target=56+(n-20)*0.45; L=3+((n%3)===0?1:0); fmin=16; fmax=24; }
else { target=72+((n*37)%73); L=4+((n%2)); fmin=24; fmax=32; }
const kind = n<=3?"normal" : (p%10===0?"special" : (p%5===0?"calm":"normal"));
if(kind==="calm"){ target=Math.max(24,target*0.6); L=Math.max(1,L-1); }
return {n,target:Math.round(target),L,fmin,fmax,kind};
}
function applyPace(prm,pace){ prm=Object.assign({},prm);
prm.pd=pace==="relax"?-1:pace==="hard"?1:0;
if(pace==="relax"){ prm.target=Math.max(20,Math.round(prm.target*0.7)); prm.L=Math.max(1,prm.L-1); prm.fmax=Math.max(prm.fmin,prm.fmax-4); }

function buildPositions(prm,seed){
const R=rng(seed);
if(prm.kind==="special"){
const k10=Math.floor(prm.n/10), key=SHAPE_KEYS[(k10+Math.floor(k10/5))%SHAPE_KEYS.length];
const pd=prm.pd||0, L=Math.max(1,Math.min(5,(prm.n<=20?2:Math.min(prm.L-pd+1,4))+pd));
let pos=stack(maskFromArt(SHAPES[key]),L,rng(seed),0.6);
if(pd<0){ const used=Math.max(...pos.map(q=>q.z))+1; if(used>1) pos=stack(maskFromArt(SHAPES[key]),used-1,rng(seed),0.6); }

}
const types=prm.n<=20?["rect","rect","diamond"]:["rect","twin","diamond","rect"];
const type=types[Math.floor(R()*types.length)];
let best=null;
for(let c=3;c<=12;c++)for(let r=2;r<=8;r++){
if((type==="twin"&&c<5)||(type==="cross"&&(c<5||r<4))||(type==="diamond"&&r<3)) continue;
const pos=stack(baseMask(type,c,r),prm.L,rng(seed),0.5);
const score=Math.abs(pos.length-prm.target)+Math.abs(c/r-1.6)*3;

let G=null;
function buildNb(){
const ts=G.tiles; ts.forEach(a=>{a.up=[];a.lf=[];a.rt=[];});
for(let i=0;i<ts.length;i++)for(let k=0;k<ts.length;k++){ if(i===k)continue; const a=ts[i],b=ts[k];
if(b.z===a.z+1&&Math.abs(b.x-a.x)<2&&Math.abs(b.y-a.y)<2) a.up.push(k);
else if(b.z===a.z&&Math.abs(b.y-a.y)<2){ if(b.x===a.x-2)a.lf.push(k); else if(b.x===a.x+2)a.rt.push(k); } }
}
function isFree(i,alive){ const a=G.tiles[i];
if(a.up.some(k=>alive[k])) return false;

}
function pairUp(indices,R){
for(let attempt=0;attempt<300;attempt++){
const alive=G.tiles.map(()=>false); indices.forEach(i=>alive[i]=true);
let remaining=indices.length; const pairs=[]; let ok=true;
while(remaining>0){
const free=[]; for(const i of indices) if(alive[i]&&isFree(i,alive)) free.push(i);
if(free.length<2){ok=false;break;}
free.sort((p,q)=>G.tiles[q].z-G.tiles[p].z+(R()-.5)*1.5);
const a=free[0], rest=free.slice(1), b=rest[Math.floor(R()*Math.min(rest.length,4))];
alive[a]=false; alive[b]=false; remaining-=2; pairs.push([a,b]);
}
if(ok) return pairs;
}
return null;
}
function newBoard(pos,seed,fmin,fmax){
const fit=(sw)=>{ let mx=0,my=0,mz=0; pos.forEach(q=>{ const x=sw?q.y:q.x, y=sw?q.x:q.y; mx=Math.max(mx,x+2); my=Math.max(my,y+2); mz=Math.max(mz,q.z); });

const tr=fit(true)>fit(false)*1.02;

const nf=Math.max(2,Math.min(32,Math.min(pairs.length,fmin+Math.floor(R()*(fmax-fmin+1)))));
const order=[...Array(32).keys()].sort(()=>R()-.5).slice(0,nf);
pairs.forEach((pr,k)=>{const f=order[k%nf]%FACES.length; G.tiles[pr[0]].f=f; G.tiles[pr[1]].f=f; G.tiles[pr[0]].g=k%nf; G.tiles[pr[1]].g=k%nf;});
}

function freePairs(){ const al=aliveArr(), byF={};

async function avLoad(f){

if(!img){ const url=URL.createObjectURL(f); img=await loadImg(url); }
if(!img||!img.width){ toast(t("avBadType")); return; }
avCrop(img); }
function avCrop(img){ window.__avImg=img; const V=240, base=Math.max(V/img.width,V/img.height); let z=1, ox=0, oy=0;
modal('<h2>'+t("avCropT")+'</h2><p>'+t("avCropP")+'</p><canvas id="avCv" width="480" height="480" aria-label="'+t("avCropT")+'"></canvas><div class="setRow"><span>'+t("avZoom")+'</span><input type="range" id="avZ" min="1" max="3" step="0.05" value="1" aria-label="'+t("avZoom")+'" style="width:150px"></div><button class="big" id="avOk">'+t("avSave")+'</button><button class="sec" id="avBack">'+t("privBack")+'</button>');
const cv=$("avCv"), g=cv.getContext("2d");
function clamp(){ const s=base*z, w=img.width*s, h=img.height*s, mx=Math.max(0,(w-V)/2), my=Math.max(0,(h-V)/2); ox=Math.max(-mx,Math.min(mx,ox)); oy=Math.max(-my,Math.min(my,oy)); }
function draw(ctx,size){ const k=size/V, s=base*z*k, w=img.width*s, h=img.height*s; ctx.clearRect(0,0,size,size); ctx.drawImage(img,(size-w)/2+ox*k,(size-h)/2+oy*k,w,h); }
function paint(){ clamp(); draw(g,480); } paint();
let drag=null; cv.onpointerdown=e=>{ drag={x:e.clientX,y:e.clientY,ox,oy}; try{cv.setPointerCapture(e.pointerId);}catch(_){} };
cv.onpointermove=e=>{ if(!drag) return; ox=drag.ox+(e.clientX-drag.x); oy=drag.oy+(e.clientY-drag.y); paint(); };
cv.onpointerup=cv.onpointercancel=()=>{ drag=null; };
$("avZ").oninput=()=>{ z=+$("avZ").value; paint(); };
window.__avNudge=(dx,dy,zz)=>{ ox+=dx; oy+=dy; if(zz){ z=zz; $("avZ").value=zz; } paint(); return [ox,oy,z]; };

const url=out.toDataURL("image/jpeg",0.85); try{ localStorage.setItem(AKEY,url); }catch(e){ toast(t("avFull")); return; }
AVPHOTO=url; S.avatar="p"; save(); applyPrefs(); toast(t("avSaved")); openProfile(); }); }

async function makeCard(kind,c,withPhotos){

g.textAlign="center"; g.fillStyle="#123047"; g.font="700 40px "+TX; g.fillText(t("cardFoot"),W/2,H-70);
return cv;
}
